<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian · Workforce decision room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F4F6F5;--pn:#fff;--ink:#14232B;--mu:#5A6A72;--ln:#D9E0DE;--teal:#0E5A60;--teal2:#D6E9EA;--amb:#9A5B00;--amb2:#F6E7CC;--bk:#A33B3F;--bk2:#F3D9DA;--sl:#66777F;--sl2:#E3E9E8;--rail:#10242B}
*{box-sizing:border-box}html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.rail{background:var(--rail);color:#E6EFED;padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-size:19px;font-weight:700;letter-spacing:-.01em;padding:0 8px}.brand small{display:block;font-size:12.5px;font-weight:400;color:#9DB2B0;margin-top:2px}
.steps{margin:26px 0 0;display:flex;flex-direction:column;gap:2px}
.steps button{display:flex;gap:11px;align-items:center;text-align:left;background:none;border:0;border-left:3px solid transparent;color:#B7C8C6;padding:9px 8px;border-radius:0 6px 6px 0}
.steps button b{width:22px;height:22px;border-radius:50%;border:1.5px solid #5B7573;font-size:12px;display:grid;place-items:center;flex:none}
.steps button[aria-current=step]{color:#fff;border-left-color:#5CC2C5;background:#183840}
.steps button[aria-current=step] b{background:#5CC2C5;border-color:#5CC2C5;color:var(--rail)}
.foot{margin-top:auto;font-size:12.5px;color:#9DB2B0;padding:0 8px}
.foot .sc{background:#183840;border-radius:6px;padding:9px 10px;margin-bottom:14px;color:#E6EFED}
.foot p{margin:4px 0;display:flex;gap:7px;align-items:center}
.mk{width:12px;height:12px;flex:none;vertical-align:-1px}
main{padding:42px 48px 80px;max-width:1120px}
h1{font-size:31px;line-height:1.2;font-weight:600;letter-spacing:-.015em;margin:0 0 12px;max-width:21em}
.lede{font-size:17px;color:var(--mu);max-width:38em;margin:0 0 26px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:6px;padding:11px 18px;font-weight:600}
.btn:hover{background:#0B474C}.btn.off{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.cons{display:grid;gap:10px;margin:0 0 30px;padding:0;list-style:none;max-width:40em}
.cons li{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:12px 16px;display:grid;grid-template-columns:170px 1fr;gap:12px}
.cons b{font-weight:600}.cons span{color:var(--mu)}
.fam{display:grid;gap:6px;margin:0 0 26px}
.fr{display:grid;grid-template-columns:270px 1fr 52px 150px;gap:14px;align-items:center;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:11px 14px;text-align:left}
.fr:hover{border-color:var(--teal)}.fr.hot{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}
.tr{height:12px;background:var(--sl2);border-radius:3px;overflow:hidden}.tr i{display:block;height:100%;background:var(--sl)}.hot .tr i{background:var(--teal)}
.fr b{text-align:right}.bs{font-size:12.5px;color:var(--mu);display:flex;gap:6px;align-items:center}
.tabs{display:inline-flex;border:1.5px solid var(--teal);border-radius:6px;overflow:hidden;margin:4px 0 24px}
.tabs button{background:#fff;border:0;padding:10px 20px;font-weight:600;color:var(--teal)}.tabs button[aria-selected=true]{background:var(--teal);color:#fff}
.pos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rg{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:12px 14px}.rg h3{font-size:14px;margin:0 0 8px}
.rg div{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:3px 0;border-top:1px solid var(--sl2)}.rg div span:last-child{color:var(--mu)}
.note{color:var(--mu);font-size:14px;margin:14px 0 0;max-width:46em}
.bar{display:flex;gap:3px;height:92px;margin:6px 0 10px;transform-origin:left}
.bar.rv{animation:gr .8s cubic-bezier(.2,.7,.2,1)}@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.seg{border:0;border-radius:6px;text-align:left;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.seg strong{font-size:25px;line-height:1.1;font-weight:700}.seg span{font-size:12.5px;line-height:1.3}
.seg:hover{filter:brightness(.96);outline:2px solid var(--ink);outline-offset:-2px}
.lg{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--mu);margin:0 0 30px}.lg span{display:flex;gap:6px;align-items:center}
.cmp{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:18px 20px;margin:0 0 30px;max-width:760px}
.cmp h2{font-size:21px;margin:0 0 12px;line-height:1.3;font-weight:600}
.cb{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;font-size:14px;margin:6px 0}.cb i{display:block;height:16px;border-radius:3px}
h2.s{font-size:19px;margin:0 0 4px;font-weight:600}
.flt{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.flt button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:5px 13px;font-size:13.5px}.flt button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:6px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--sl2);white-space:nowrap}
th{font-weight:600;background:#F0F3F2;position:sticky;top:0}tr[data-a]{cursor:pointer}tr[data-a]:hover td{background:#F4F9F9}
td .ev{display:flex;gap:6px;align-items:center}
.dec{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:0 0 26px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.card.in{border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal)}.card.no{background:#FBF3F3;border-color:#E6BFC0}
.card h3{margin:0;font-size:16px;line-height:1.35;font-weight:600}.card p{margin:0;font-size:14px;color:var(--mu)}
.card .m{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px solid var(--sl2);padding-top:8px}.card .m b{font-weight:600}
.brief{background:var(--rail);color:#E6EFED;border-radius:6px;padding:20px 22px;max-width:760px}.brief h2{margin:0 0 8px;font-size:18px}.brief p{margin:6px 0;font-size:14.5px;color:#C7D6D4}.brief b{color:#fff}
.dr{position:fixed;top:0;right:0;width:392px;max-width:100%;height:100vh;background:#fff;border-left:1px solid var(--ln);padding:26px 24px;overflow:auto;transform:translateX(102%);transition:transform .25s;z-index:5;box-shadow:-12px 0 28px rgba(16,36,43,.12)}
.dr.open{transform:none}.dr h3{font-size:19px;margin:0 30px 8px 0;line-height:1.3}.dr h4{font-size:13.5px;margin:18px 0 3px;color:var(--mu);font-weight:600}.dr p{margin:0;font-size:14.5px}
.dr .tg{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--teal)}
.dr .x{position:absolute;top:14px;right:16px;border:0;background:none;font-size:26px;line-height:1;color:var(--mu)}
.f{color:var(--teal)}.h{color:var(--amb)}.o{color:var(--sl)}
@media(max-width:960px){.app{grid-template-columns:1fr}.rail{position:static;height:auto}.steps{flex-direction:row;flex-wrap:wrap;margin-top:14px}.foot{margin-top:14px}main{padding:26px 18px 60px}.fr{grid-template-columns:1fr 60px}.fr .tr,.fr .bs{grid-column:1/-1}.pos{grid-template-columns:1fr 1fr}.dec{grid-template-columns:1fr}.cons li{grid-template-columns:1fr}.bar{height:auto;flex-wrap:wrap}.seg{flex:1 1 45%!important;min-height:84px}}
@media(prefers-reduced-motion:reduce){.bar.rv{animation:none}.dr{transition:none}}
</style></head><body>
<div class="app">
<aside class="rail"><div class="brand">Meridian<small>Workforce decision room</small></div>
<nav class="steps" aria-label="Journey">
<button data-a="go" data-v="0"><b>1</b>The mandate</button>
<button data-a="go" data-v="1"><b>2</b>Where AI lands</button>
<button data-a="go" data-v="2"><b>3</b>Position to capability</button>
<button data-a="go" data-v="3"><b>4</b>What to decide</button></nav>
<div class="foot"><div class="sc">Base case. Cost, attrition, eligibility and seat figures are illustrative assumptions, not Client data.</div>
<p class="f"><svg class="mk f" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6" fill="currentColor" stroke="currentColor" stroke-width="1.4"/></svg><span style="color:#E6EFED">Measured or given</span></p>
<p class="h"><svg class="mk h" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 1.4a4.6 4.6 0 0 0 0 9.2z" fill="currentColor"/></svg><span style="color:#E6EFED">Inferred</span></p>
<p class="o"><svg class="mk o" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6" fill="none" stroke="#9DB2B0" stroke-width="1.4" stroke-dasharray="2.4 1.6"/></svg><span style="color:#E6EFED">Assumed or unknown</span></p></div></aside>
<main id="mn"></main></div>
<aside id="dr" class="dr" role="dialog" aria-label="What this rests on"></aside>
<script>
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('en-US');
const mk=t=>`<svg class="mk ${t}" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.6" fill="${t=='f'?'currentColor':'none'}" stroke="currentColor" stroke-width="1.4" ${t=='o'?'stroke-dasharray="2.4 1.6"':''}/>${t=='h'?'<path d="M6 1.4a4.6 4.6 0 0 0 0 9.2z" fill="currentColor"/>':''}</svg>`;
const BASIS={f:'Measured or given',h:'Inferred',o:'Assumed'};
const TIER={V:['f','Verified'],O:['f','Observed'],I:['h','Inferred'],U:['o','Unknown']};
const CONF={H:'High',M:'Medium',L:'Low'};
const FAM=[['Field metering and manual operations',70,'f'],['Meter data entry and billing back-office',55,'o'],['Customer service and contact centre',50,'o'],['Finance and accounting operations',38,'o'],['HR and general administration',35,'o'],['Procurement and logistics',30,'o'],['Network operations and dispatch',22,'o'],['Engineering and planning',18,'o'],['Plant operations and maintenance',15,'o']];
const REG=['Sumatra','West Java–Banten','Central Java','East Java–Bali','Kalimantan','Sulawesi'];
const TT=[[['Petugas Baca Meter',412],['Meter Reader Sr II',188],['Teknisi Meter Madya',96]],[['Pelaksana Pembacaan Meter',530],['Senior Technician II',142],['Field Officer, Meter Ops',77]],[['Petugas Baca Meter',301],['Teknisi Meter Pelaksana',164],['Meter Reader Sr I',89]],[['Pelaksana Meter Lapangan',455],['Teknisi Meter Madya',118],['Senior Technician I',64]],[['Petugas Lapangan Meter',276],['Meter Reader Sr II',131],['Teknisi Distribusi Meter',58]],[['Pelaksana Baca Meter',233],['Technician II, Metering',97],['Petugas Meter Madya',44]]];
const PATH=['Smart-meter installation and service','Meter-data exceptions analyst','Loss and anomaly investigation','Distribution field operations'];
const REC=[[48213,1,'Senior Technician II',11,0,'V','H','Certified installer; led meter replacement crews.'],[51877,0,'Petugas Baca Meter',8,1,'I','M','Completed a data-handling course; no assessed skill record.'],[39402,2,'Teknisi Meter Madya',14,0,'O','H','Supervisor-validated on the 2025 smart-meter pilot.'],[60215,4,'Meter Reader Sr II',6,-1,'U','L','Skill fields blank; no training history found.'],[44190,3,'Pelaksana Meter Lapangan',19,2,'O','M','Flagged reading anomalies; handled customer disputes.'],[57731,5,'Pelaksana Baca Meter',3,1,'I','L','One LMS course; short tenure.'],[41008,1,'Teknisi Meter Madya',17,3,'V','H','Holds a distribution-line safety certificate.'],[52964,0,'Meter Reader Sr II',9,-1,'U','L','No record beyond title and region.'],[38811,2,'Petugas Baca Meter',22,2,'O','M','Long tenure; supervisor notes record loss-case help.'],[49326,4,'Meter Reader Sr II',12,0,'I','M','IoT basics completed in Moodle; no assessment yet.'],[55540,3,'Pelaksana Meter Lapangan',5,1,'U','L','Skill fields blank.'],[43377,1,'Pelaksana Pembacaan Meter',15,2,'I','M','Role history includes inspection assignments.'],[58102,5,'Petugas Meter Madya',7,-1,'U','L','Identity does not match between HRIS and LMS.'],[40655,0,'Teknisi Meter Madya',16,0,'V','H','Certified; completed vendor smart-meter training.'],[46829,2,'Teknisi Meter Pelaksana',10,3,'I','M','Assisted network maintenance crews.'],[53418,4,'Petugas Lapangan Meter',13,1,'O','M','Corrected billing exceptions; supervisor-validated.'],[37290,3,'Senior Technician I',20,3,'V','H','Certified; deputised as crew lead.'],[59044,1,'Petugas Baca Meter',4,-1,'U','L','Skill fields blank; pre-2023 ratings excluded.'],[45517,5,'Technician II, Metering',18,0,'I','M','Two smart-meter courses; no assessment yet.'],[50683,0,'Petugas Baca Meter',11,2,'O','H','Documented loss cases closed in 2025.'],[42266,4,'Meter Reader Sr II',14,1,'I','L','Course completed; completion data is partial.'],[56379,2,'Petugas Baca Meter',6,-1,'U','L','No usable record.'],[47901,3,'Pelaksana Meter Lapangan',21,3,'O','M','Previously rotated through maintenance.'],[54152,5,'Pelaksana Baca Meter',8,1,'I','M','Digital skills course; supervisor feedback pending.']];
const SEG=[{n:630,l:'Leave through natural attrition',c:'background:var(--sl2);color:#33444C',m:'o',r:'15% of the 4,200, an assumption. The brief gives no retirement or attrition data.',s:'Low. It is a placeholder.',v:'Retirement eligibility by age in HRIS for this family.',d:'Plan around it. Do not make commitments that depend on it.'},
{n:1200,l:'Have a seat in an adjacent band',c:'background:var(--teal);color:#fff',m:'o',r:'Seat capacity in adjacent bands over 24 months, assumed at 1,200. Capability is inferred for more people than this, so seats set the limit.',s:'Low to medium. Seats are assumed; capability is inferred.',v:'Receiving units’ vacancy forecast, and pilot assessments by Day 60.',d:'Open assessments and reskilling offers. Do not announce placements yet.'},
{n:764,l:'Look capable, but no seat yet',c:'background:var(--amb2);color:#5E3700',m:'h',r:'1,964 look capable of an adjacent role (55% of the 3,570 remaining, assumed) minus the 1,200 seats.',s:'Low to medium. The 55% comes from inferred evidence.',v:'Assessment results; decisions on creating or opening seats.',d:'Ask the Board to open seats. Do not rank these people.'},
{n:1606,l:'No path identified yet',c:'background:var(--bk2);color:#6E1F23',m:'o',r:'The remaining 45% of affected people. Many have blank skill records, and a blank means unknown, not lacking.',s:'Low. The path is missing from the data, not necessarily from the person.',v:'Assessing the whole group, and designing longer reskilling paths.',d:'Offer assessment and a longer path. Never treat as surplus.'}];
const TRUST={V:'High. A certificate or assessment result backs it.',O:'Medium to high. A supervisor or work record backs it, not yet a test.',I:'Low to medium. A course or role history suggests it; nothing confirms it.',U:'Not known. A blank is missing data, never a finding that the skill is absent.'};
const ALLOW={V:'Support a placement offer.',O:'Support a placement offer after a short check.',I:'Invite to assessment or offer reskilling. Nothing more.',U:'Invite to assessment. Nothing more.'};
const DEC=[['a','Offer a capability assessment to all 3,570 affected people','About Rp 3.6 B','Yes','An invitation, not a judgment. It works on inferred and unknown evidence, and it is what turns inferred into verified.'],
['b','Start reskilling for the 1,200 people who have a seat','About Rp 21.6 B','Yes, in waves','Start with Verified and Observed records. Inferred records go through assessment first.'],
['c','Ask the Board to open seats for the 764 capable people without one','Seat cost sits with receiving units','Yes, as a request','Capability is inferred and seats are assumed. Confirm both with receiving units by Day 60.'],
['d','Commit to a no-layoff pathway for the 2,370 residual people','Carrying cost about Rp 355 B a year','Yes, as a commitment to design it','The Board will ask about this number first. The pathway (longer reskilling, voluntary options, attrition) is not designed yet.']];
const st={step:0,view:'pos',flt:'all',pick:new Set(),anim:false};
function dr(o){$('#dr').innerHTML=`<button class="x" data-a="close" aria-label="Close">×</button><h3>${o.t}</h3><div class="tg">${mk(o.m)}<b>${o.l}</b></div>${o.rows.map(r=>`<h4>${r[0]}</h4><p>${r[1]}</p>`).join('')}`;$('#dr').classList.add('open')}
const close=()=>$('#dr').classList.remove('open');
const s0=()=>`<h1>Which of our people will AI displace, and what do we do with them?</h1><p class="lede">You asked this on day one, with three conditions. This room answers it in four steps, and shows how sure we are of each number.</p><ul class="cons"><li><b>No mass layoffs</b><span>Redeployment the Board believes, the Ministry approves and the union can support.</span></li><li><b>No system migration</b><span>Works on top of SuccessFactors, Moodle and the regional performance tools.</span></li><li><b>No payroll data</b><span>Oracle stays off-limits under Ministry policy. Every cost figure here is an assumption.</span></li></ul><button class="btn" data-a="go" data-v="1">Show where AI lands first</button>`;
const s1=()=>`<h1>One family is exposed now. The rest are estimates.</h1><p class="lede">Field metering and manual operations: about 6,000 people, 11.5% of the workforce, with roughly 70% of the work automatable within 18 months. The other bars are first-pass task estimates, not measured on your data.</p><div class="fam">${FAM.map((f,i)=>`<button class="fr${i?'':' hot'}" data-a="fam" data-v="${i}"><span>${f[0]}</span><span class="tr"><i style="width:${f[1]}%"></i></span><b>${f[1]}%</b><span class="bs ${f[2]}">${mk(f[2])}<span style="color:var(--mu)">${BASIS[f[2]]}</span></span></button>`).join('')}</div><button class="btn" data-a="go" data-v="2">Open the metering family</button>`;
function s2(){const tabs=`<div class="tabs" role="tablist"><button role="tab" aria-selected="${st.view=='pos'}" data-a="view" data-v="pos">Position view</button><button role="tab" aria-selected="${st.view=='cap'}" data-a="view" data-v="cap">Capability view</button></div>`;
if(st.view=='pos')return `<h1>Today, this family is 18 titles across six regions.</h1><p class="lede">The same work carries different titles in each region. A title is a contract, so nothing here can move without reopening one.</p>${tabs}<div class="pos">${TT.map((r,i)=>`<div class="rg"><h3>${REG[i]}</h3>${r.map(t=>`<div><span>${t[0]}</span><span>${fmt(t[1])}</span></div>`).join('')}</div>`).join('')}</div><p class="note">Illustrative sample from a register of more than 1,800 titles. Switch to the capability view to see the same people as work, not titles.</p>`;
const fl=st.flt,rows=REC.filter(r=>fl=='all'||String(r[4])==fl);
const chips=[['all','All'],...PATH.map((p,i)=>[String(i),p]),['-1','No path yet']];
return `<h1>The 4,200 is work, not names. And seats, not skills, are the limit.</h1><p class="lede">About 4,200 full-time equivalents of work disappear. Select any block to see what it rests on and what you may decide from it.</p>${tabs}<div class="bar${st.anim?' rv':''}">${SEG.map((s,i)=>`<button class="seg" data-a="seg" data-v="${i}" style="${s.c};flex:${s.n} 1 0"><strong>${fmt(s.n)}</strong><span>${s.l}</span></button>`).join('')}</div><div class="lg">${SEG.map(s=>`<span class="${s.m}">${mk(s.m)}<span>${BASIS[s.m]}</span></span>`).slice(0,0).join('')}<span class="o">${mk('o')}Attrition, seats and the no-path group are assumed</span><span class="h">${mk('h')}Capable-but-no-seat is inferred</span></div>
<div class="cmp"><h2>1,964 people look capable of an adjacent role. Only 1,200 seats exist.</h2><div class="cb"><span>Look capable</span><i style="background:var(--amb);width:100%"></i><b>1,964</b></div><div class="cb"><span>Seats available</span><i style="background:var(--teal);width:61.1%"></i><b>1,200</b></div></div>
<h2 class="s">Who sits behind the blocks</h2><p class="note" style="margin:0">A 24-record sample. A full run would score all 6,000. Select a row to see its evidence.</p><div class="flt">${chips.map(c=>`<button aria-pressed="${fl==c[0]}" data-a="flt" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
<div class="tw"><table><thead><tr><th>HRIS ID</th><th>Region</th><th>Title on record</th><th>Best-fit band</th><th>Evidence</th><th>Confidence</th></tr></thead><tbody>${rows.map(r=>{const t=TIER[r[5]];return `<tr data-a="rec" data-v="${REC.indexOf(r)}" tabindex="0"><td>EMP-${r[0]}</td><td>${REG[r[1]]}</td><td>${r[2]}</td><td>${r[4]<0?'None yet':PATH[r[4]]}</td><td><span class="ev ${t[0]}">${mk(t[0])}<span style="color:var(--ink)">${t[1]}</span></span></td><td>${CONF[r[6]]}</td></tr>`}).join('')}</tbody></table></div>`}
const s3=()=>{const n=st.pick.size;return `<h1>Four decisions you can take now. One you cannot.</h1><p class="lede">Each decision shows what it costs and whether today’s evidence supports it. Add the ones you will take to the Board.</p><div class="dec">${DEC.map(d=>`<div class="card${st.pick.has(d[0])?' in':''}"><h3>${d[1]}</h3><p>${d[4]}</p><div class="m"><span>${d[2]}</span><b>${d[3]}</b></div><button class="btn${st.pick.has(d[0])?' off':''}" data-a="pick" data-v="${d[0]}">${st.pick.has(d[0])?'Remove from Board brief':'Add to Board brief'}</button></div>`).join('')}<div class="card no"><h3>Name anyone as surplus</h3><p>No evidence tier supports this. Any adverse decision needs a full assessment and a human review, and none exists yet.</p><div class="m"><span>Not on today’s evidence</span><b>No</b></div></div></div>
<div class="brief"><h2>${n?n+' of 4 decisions in your Board brief':'Your Board brief is empty'}</h2>${n?`<p>${DEC.filter(d=>st.pick.has(d[0])).map(d=>'<b>'+d[1]+'.</b>').join(' ')}</p>`:'<p>Add decisions above. They collect here.</p>'}<p>At the Day 90 gate the Board sees: assessments run for a pilot group, seats confirmed with receiving units, and a first reskilling cohort started. Completed redeployments are not claimed.</p></div>`};
function draw(top){document.querySelectorAll('.steps button').forEach((b,i)=>{i==st.step?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current')});$('#mn').innerHTML=[s0,s1,s2,s3][st.step]();st.anim=false;if(top)window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a=='go'){st.step=+v;close();draw(1)}
else if(a=='view'){st.view=v;st.anim=v=='cap';close();draw(1)}
else if(a=='flt'){st.flt=v;draw()}
else if(a=='seg'){const s=SEG[+v];dr({t:fmt(s.n)+' · '+s.l,m:s.m,l:BASIS[s.m],rows:[['What this rests on',s.r],['How sure we are',s.s],['What would change it',s.v],['What you may decide',s.d]]})}
else if(a=='fam'){const f=FAM[+v],hot=+v==0;dr({t:f[0],m:f[2],l:BASIS[f[2]],rows:[['What this rests on',hot?'The brief: about 70% of this family’s work is automatable within 18 months, through smart meters, IoT and AI-assisted operations already in procurement.':'A first-pass task-scoring estimate. It is not measured on Client data.'],['How sure we are',hot?'Moderate. It is a share of work, not a count of people.':'Low. Use it for ordering only.'],['What would change it',hot?'The procurement and rollout schedule of the smart-meter programme.':'Task-level review with each function.'],['What you may decide',hot?'Use it as the planning anchor for the first 90 days.':'Sequencing only. No redeployment analysis is planned for this family in the first 90 days.']]})}
else if(a=='rec'){const r=REC[+v],t=TIER[r[5]],lms=r[0]==48213?'learner_9981':(r[0]==58102?'no match found':'learner_'+(r[0]*7%10000));dr({t:'EMP-'+r[0]+' · '+r[2],m:t[0],l:t[1]+' · '+CONF[r[6]]+' confidence',rows:[['Best-fit band',r[4]<0?'None identified yet.':PATH[r[4]]+'.'],['What this rests on',r[7]+' '+r[3]+' years in role.'],['Identity match','HRIS EMP-'+r[0]+' · LMS '+lms+' · Payroll restricted by Ministry policy.'],['How sure we are',TRUST[r[5]]],['What you may decide',ALLOW[r[5]]]]})}
else if(a=='pick'){st.pick.has(v)?st.pick.delete(v):st.pick.add(v);draw()}
else if(a=='close')close()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')close();if(e.key=='Enter'&&e.target.matches('tr[data-a]'))e.target.click()});
draw();
</script></body></html>
